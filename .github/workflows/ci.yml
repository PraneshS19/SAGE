name: SAGE checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Allow Playwright Chromium to start its sandbox
        shell: bash
        run: |
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 1 ]]; then
            exit 0
          fi
          browser="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          test -x "$browser"
          sudo apparmor_parser -r <<EOF
          abi <abi/4.0>,
          profile sage-playwright-chromium "$browser" flags=(unconfined) {
            userns,
          }
          EOF
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - run: npm run verify:release
      - run: node scripts/check-publication.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sage-chromium
          path: dist/SAGE-0.1.3/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/playwright/
